<div class="shell" [class.menu-open]="menuOpen()">
  <header class="mobile-bar">
    <a routerLink="/" class="brand" aria-label="LUMI - inicio">
      <img src="assets/logo-lumi.png" alt="LUMI" class="side-logo" />
    </a>
    <button class="menu-btn" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()">
      <span></span><span></span>
    </button>
  </header>

  <div class="backdrop" (click)="closeMenu()"></div>

  <aside class="side">
    <a routerLink="/" class="brand desktop-brand" aria-label="LUMI - inicio" (click)="closeMenu()">
      <img src="assets/logo-lumi.png" alt="LUMI" class="side-logo" />
    </a>
    <p class="side-label">Administração</p>
    <nav>
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!link.exact }"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
    </nav>
    <div class="side-foot">
      <p>{{ auth.user()?.nome }}</p>
      <button type="button" class="btn btn-ghost" (click)="auth.logout()">Sair</button>
    </div>
  </aside>

  <section class="content">
    <header class="content-head">
      <div>
        <p class="eyebrow">Área administrativa</p>
        <h1>Gestão Lumi</h1>
      </div>
      <a routerLink="/" class="btn btn-soft">Ver site</a>
    </header>
    <router-outlet />
  </section>
</div>
