<div class="layout">
  <form class="panel form" [formGroup]="form" (ngSubmit)="salvar()">
    <h2 class="panel-title">Novo cliente</h2>
    <div class="grid-2">
      <div class="field"><label>Nome</label><input formControlName="nome" /></div>
      <div class="field"><label>E-mail</label><input formControlName="email" type="email" /></div>
      <div class="field"><label>Telefone</label><input formControlName="telefone" /></div>
      <div class="field"><label>CPF</label><input formControlName="cpf" /></div>
      <div class="field"><label>Nascimento</label><input formControlName="dataNascimento" type="date" /></div>
      <div class="field"><label>EndereÃ§o</label><input formControlName="endereco" /></div>
    </div>
    <div class="field"><label>ObservaÃ§Ãµes</label><textarea formControlName="observacoes"></textarea></div>
    <button class="btn btn-primary" type="submit">Cadastrar</button>
  </form>

  <div class="panel">
    <h2 class="panel-title">Clientes</h2>
    <div class="table-wrap">
      <table class="data">
        <thead>
          <tr><th>Nome</th><th>Contato</th><th>CPF</th><th>Desde</th></tr>
        </thead>
        <tbody>
          @for (c of data.clientes(); track c.id) {
            <tr>
              <td data-label="Nome">{{ c.nome }}</td>
              <td data-label="Contato">
                <span class="stack">
                  <span>{{ c.email }}</span>
                  <small>{{ c.telefone }}</small>
                </span>
              </td>
              <td data-label="CPF">{{ c.cpf }}</td>
              <td data-label="Desde">{{ data.formatDate(c.criadoEm) }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
