<div class="layout">
  <form class="panel form" [formGroup]="form" (ngSubmit)="salvar()">
    <h2 class="panel-title">Nova imagem</h2>
    <div class="grid-2">
      <div class="field"><label>Título</label><input formControlName="titulo" /></div>
      <div class="field"><label>Categoria</label><input formControlName="categoria" /></div>
    </div>
    <div class="field"><label>URL da imagem</label><input formControlName="imagem" /></div>
    <label class="check"><input type="checkbox" formControlName="publicado" /> Publicado</label>
    <button class="btn btn-primary" type="submit">Salvar</button>
  </form>

  <div class="panel">
    <h2 class="panel-title">Galeria</h2>
    <div class="gallery">
      @for (g of data.galeria(); track g.id) {
        <figure>
          <img [src]="g.imagem" [alt]="g.titulo" />
          <figcaption>{{ g.titulo }} · {{ g.categoria }}</figcaption>
        </figure>
      }
    </div>
  </div>
</div>
