<div class="panel">
  <h2 class="panel-title">Leads recebidos pelo site</h2>
  <div class="table-wrap">
    <table class="data">
      <thead>
        <tr>
          <th>Quando</th>
          <th>Nome</th>
          <th>Contato</th>
          <th>Interesse</th>
          <th>Mensagem</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (l of data.leads(); track l.id) {
          <tr>
            <td data-label="Quando">{{ data.formatDateTime(l.criadoEm) }}</td>
            <td data-label="Nome">{{ l.nome }}</td>
            <td data-label="Contato">
              <span class="stack">
                <span>{{ l.email }}</span>
                <small>{{ l.telefone }}</small>
              </span>
            </td>
            <td data-label="Interesse">{{ l.interesse }}</td>
            <td data-label="Mensagem">{{ l.mensagem }}</td>
            <td data-label="Status">
              <select [value]="l.status" (change)="atualizar(l.id, $any($event.target).value)">
                <option value="novo">Novo</option>
                <option value="contactado">Contactado</option>
                <option value="convertido">Convertido</option>
                <option value="arquivado">Arquivado</option>
              </select>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
