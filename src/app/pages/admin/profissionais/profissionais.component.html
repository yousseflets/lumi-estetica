<div class="layout">
  <form class="panel form" [formGroup]="form" (ngSubmit)="salvar()">
    <h2 class="panel-title">Novo profissional</h2>
    <div class="grid-2">
      <div class="field"><label>Nome</label><input formControlName="nome" /></div>
      <div class="field"><label>Cargo</label><input formControlName="cargo" /></div>
    </div>
    <div class="field"><label>Bio</label><textarea formControlName="bio"></textarea></div>
    <div class="field"><label>Especialidades (separadas por vírgula)</label><input formControlName="especialidades" /></div>
    <div class="field"><label>URL da foto</label><input formControlName="foto" /></div>
    <label class="check"><input type="checkbox" formControlName="ativo" /> Ativo</label>
    <button class="btn btn-primary" type="submit">Cadastrar</button>
  </form>

  <div class="panel">
    <h2 class="panel-title">Profissionais</h2>
    <div class="table-wrap">
      <table class="data">
        <thead><tr><th>Nome</th><th>Cargo</th><th>Especialidades</th><th>Status</th></tr></thead>
        <tbody>
          @for (p of data.profissionais(); track p.id) {
            <tr>
              <td data-label="Nome">{{ p.nome }}</td>
              <td data-label="Cargo">{{ p.cargo }}</td>
              <td data-label="Especialidades">{{ p.especialidades.join(', ') }}</td>
              <td data-label="Status"><span class="badge" [class.ok]="p.ativo">{{ p.ativo ? 'Ativo' : 'Inativo' }}</span></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
