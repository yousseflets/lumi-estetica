<div class="panel">
  <h1 class="panel-title">Próximos agendamentos</h1>
  <div class="table-wrap">
    <table class="data">
      <thead>
        <tr><th>Quando</th><th>Procedimento</th><th>Profissional</th><th>Status</th></tr>
      </thead>
      <tbody>
        @for (a of meus(); track a.id) {
          <tr>
            <td data-label="Quando">{{ data.formatDateTime(a.dataHora) }}</td>
            <td data-label="Procedimento">{{ a.procedimentoNome }}</td>
            <td data-label="Profissional">{{ a.profissionalNome }}</td>
            <td data-label="Status"><span class="badge">{{ a.status }}</span></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
