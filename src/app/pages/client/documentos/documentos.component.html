<div class="panel">
  <h1 class="panel-title">Documentos</h1>
  <div class="table-wrap">
    <table class="data">
      <thead>
        <tr><th>Documento</th><th>Tipo</th><th>Data</th><th></th></tr>
      </thead>
      <tbody>
        @for (d of data.documentos(); track d.id) {
          <tr>
            <td data-label="Documento">{{ d.titulo }}</td>
            <td data-label="Tipo">{{ d.tipo }}</td>
            <td data-label="Data">{{ data.formatDate(d.data) }}</td>
            <td data-label="Arquivo"><a class="btn btn-ghost" [href]="d.url">Abrir</a></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
