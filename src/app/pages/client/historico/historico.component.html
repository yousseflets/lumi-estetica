<div class="panel">
  <h1 class="panel-title">Histórico de atendimentos</h1>
  <div class="table-wrap">
    <table class="data">
      <thead>
        <tr><th>Data</th><th>Procedimento</th><th>Profissional</th><th>Observações</th><th>Valor</th></tr>
      </thead>
      <tbody>
        @for (a of data.atendimentosCliente(); track a.id) {
          <tr>
            <td data-label="Data">{{ data.formatDate(a.data) }}</td>
            <td data-label="Procedimento">{{ a.procedimento }}</td>
            <td data-label="Profissional">{{ a.profissional }}</td>
            <td data-label="Observações">{{ a.observacoes }}</td>
            <td data-label="Valor">{{ data.formatCurrency(a.valor) }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
