<section class="section">
  <div class="container">
    <div class="section-head reveal">
      <p class="eyebrow">Depoimentos</p>
      <h2>Histórias de cuidado</h2>
      <p>A confiança das nossas clientes é o que mais nos move.</p>
    </div>

    <div class="grid">
      @for (d of data.depoimentos(); track d.id) {
        @if (d.publicado) {
          <blockquote class="item reveal">
            <div class="stars">{{ '?'.repeat(d.nota) }}</div>
            <p>{{ d.texto }}</p>
            <footer>
              <strong>{{ d.nome }}</strong>
              <span>{{ d.tratamento }} · {{ data.formatDate(d.data) }}</span>
            </footer>
          </blockquote>
        }
      }
    </div>
  </div>
</section>
