<section class="login-page">
  <div class="login-glow" aria-hidden="true"></div>

  <div class="login-card reveal">
    <a routerLink="/" class="brand" aria-label="LUMI - inicio">
      <img src="assets/logo-lumi.png" alt="LUMI Clínica de Estética" class="login-logo" />
    </a>

    <div class="intro">
      <p class="eyebrow">Acesso</p>
      <h1>Entrar</h1>
      <p>Área administrativa ou área do cliente.</p>
    </div>

    <form class="form" [formGroup]="form" (ngSubmit)="entrar()">
      @if (erro()) {
        <p class="error">{{ erro() }}</p>
      }

      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" placeholder="seu&#64;email.com" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" formControlName="password" placeholder="Sua senha" autocomplete="current-password" />
      </div>

      <button class="btn btn-primary submit" type="submit">Entrar</button>
    </form>

    <div class="demo">
      <p class="demo-label">Acesso rápido</p>
      <div class="demo-actions">
        <button type="button" class="demo-btn" (click)="preencher('admin')">Admin</button>
        <button type="button" class="demo-btn" (click)="preencher('cliente')">Cliente</button>
      </div>
    </div>
  </div>
</section>
